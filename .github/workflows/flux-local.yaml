# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flux Local"
on:
  pull_request:
    paths:
      - flux/**
      - .github/workflows/flux-local.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Renders every Kustomization and HelmRelease reachable from the Flux entrypoint
  # (flux/clusters/dev) without a cluster, and fails on any render/build error.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@23dcfe98fe672acdf44ecd9c60cbac41b57f5de8 # v2.10.1
        with:
          version: 2.9.5 # matches flux/clusters/dev/flux-instance.yaml

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"

      # Runs the CLI instead of allenporter/flux-local/action/test: that action omits
      # --all-namespaces, so it only tests Kustomizations in flux-system (5 of ~80 here).
      - name: Test
        run: uvx --from flux-local==8.4.0 flux-local test --enable-helm --all-namespaces --path flux/clusters/dev -v

  # Shows what a PR changes in the rendered Helm output (e.g. a chart version bump).
  # Written to the job summary, not a PR comment, so no extra permissions are needed.
  diff:
    name: Diff HelmReleases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@23dcfe98fe672acdf44ecd9c60cbac41b57f5de8 # v2.10.1
        with:
          version: 2.9.5 # matches flux/clusters/dev/flux-instance.yaml

      - name: Diff
        id: diff
        uses: allenporter/flux-local/action/diff@92d3a538c009c3fec120fbf50f6ef33b3e0a569c # 8.4.0
        with:
          path: flux/clusters/dev
          resource: helmrelease

      - name: Summary
        env:
          DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          {
            echo '### Rendered HelmRelease diff'
            echo '```diff'
            printf '%s\n' "${DIFF:-No rendered HelmRelease changes}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
