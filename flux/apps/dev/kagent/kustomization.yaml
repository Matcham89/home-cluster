---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kagent
components:
  # Privileged PSS: substrate worker pool launches gVisor sandbox pods (ateom-gvisor)
  # which require elevated capabilities that the baseline/restricted profiles reject.
  - ../../../infra/namespace-privileged

resources:
  - ./crds/ks.yaml
  - ./operator/ks.yaml
  - ./limit-ranges/ks.yaml
  - ./network-policies/ks.yaml
  - ./secrets/ks.yaml
  - ./oauth2-proxy/ks.yaml
  - ./providers/ks.yaml
  - ./mcps/ks.yaml
  - ./agents/ks.yaml
  - ./github-webhook-receiver/ks.yaml
  - ./agent-sandbox/ks.yaml
  # DISABLED - hermes AgentHarness not yet working, see agent-harnesses/ks.yaml
  # - ./agent-harnesses/ks.yaml
