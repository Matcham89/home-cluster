---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agentdesktop-controller
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: agentdesktop-tls
    - name: agentdesktop-config
    - name: agentdesktop-referencegrants
  interval: 1h
  path: ./flux/apps/base/agentdesktop/controller
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agentdesktop
  timeout: 10m
  prune: true
  wait: true
