---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system-flux-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api-crds
      namespace: agentgateway-system
  interval: 30m
  path: ./flux/apps/base/flux-system/flux-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
