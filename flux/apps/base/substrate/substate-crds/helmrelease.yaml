---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate-crds

spec:
  interval: 1m0s
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate-crds
  ref:
    # renovate: datasource=github-releases depName=kagent-dev/substrate extractVersion=^v(?<version>.*)$
    # NOTE: chart tags are published WITHOUT the v prefix (0.0.9, not v0.0.9)
    tag: 0.0.9
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-crds
spec:
  interval: 1m0s
  releaseName: substrate-crds
  chartRef:
    kind: OCIRepository
    name: substrate-crds
  install:
    createNamespace: true
    remediation:
      retries: 3