---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/helmrepository-source-v1.json
# Reference to Helm repository
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
spec:
  interval: 10m
  url: https://charts.longhorn.io
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  # Override Release name to avoid the pattern Namespace-Release
  # Ref: https://fluxcd.io/flux/components/helm/api/v2/#helm.toolkit.fluxcd.io/v2.HelmRelease
  interval: 10m
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
  values:
    defaultSettings:
      # Reduced from default 12% to prevent resource request/limit conflicts
      # Instance manager pods were failing with: requests (954m) > limits (500m)
      # Setting to 5% provides adequate performance while staying within resource limits
      guaranteedInstanceManagerCPU: 5
      # Increase storage over-provisioning from 100% to 200% (Longhorn default)
      # This allows scheduling up to 2x physical storage capacity
      # Safe for typical workloads as volumes are rarely fully utilized simultaneously
      # Required to support current volume requirements with 30% reserved storage
      storageOverProvisioningPercentage: 200
      # --- Power-outage resilience (added after 2026-07-16 outage) ---
      # Re-attach and remount volumes whose workloads had them attached when
      # the node went down unexpectedly. Without this, RWO volumes stay stuck
      # until a human deletes pods/VolumeAttachments.
      autoSalvage: true
      # Delete the workload pod so the StatefulSet/Deployment controller can
      # recreate it and re-attach the volume when a volume detaches
      # unexpectedly. Key for StatefulSets (valkey, loki, postgres) after
      # abrupt node reboots.
      autoDeletePodWhenVolumeDetachedUnexpectedly: true
      # After a node comes back, wait before evicting/rebuilding replicas so
      # a whole-cluster restart doesn't trigger a rebuild storm (which is what
      # OOM-killed instance-managers during the outage recovery).
      replicaReplenishmentWaitInterval: 600
      # Limit concurrent rebuilds per node to keep instance-manager memory
      # bounded when many volumes recover at once.
      concurrentReplicaRebuildPerNodeLimit: 2
      # Detach volumes cleanly during node drain/shutdown so a graceful
      # (UPS-initiated) shutdown never leaves stale attachments behind.
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod