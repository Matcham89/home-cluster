---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: qdrant
spec:
  interval: 10m
  url: https://qdrant.github.io/qdrant-helm
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
spec:
  interval: 1m
  chart:
    spec:
      chart: qdrant
      version: 1.18.2
      sourceRef:
        kind: HelmRepository
        name: qdrant
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
  values:
    replicaCount: 1

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    persistence:
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      storageClassName: longhorn

    # LAN access: home-pool only had 192.168.1.215 free (.201-.214,.216 are
    # already claimed by ingress-gateway/kgateway/monitoring services).
    service:
      type: LoadBalancer
      loadBalancerIP: "192.168.1.215"

    # Chart defaults already satisfy most of the restricted PSS
    # (../../../infra/namespace); add the drop-ALL capability set and
    # seccomp profile it doesn't set on its own.
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
