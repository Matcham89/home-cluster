---
# Qdrant API key, pulled from the Bitwarden secret store. Consumed by the
# qdrant HelmRelease via apiKey.valueFrom (key: api-key). The chart creates its
# own qdrant-apikey secret, so this one uses a different name.
# kagent/secrets/qdrant-api-key.yaml pulls the same value for the MCP server.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qdrant-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: qdrant-api-key
  data:
    - secretKey: api-key
      remoteRef:
        # TODO: replace with the Bitwarden secret ID of the Qdrant API key
        key: "00000000-0000-0000-0000-000000000000"
