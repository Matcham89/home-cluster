---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qdrant-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: qdrant-api-key
  data:
    - secretKey: api-key
      remoteRef:
        # TODO: replace with the Bitwarden Secrets Manager secret ID holding the key
        key: "00000000-0000-0000-0000-000000000000"
