---
# API key for Qdrant, pulled from Bitwarden Secrets Manager.
# TODO: replace the remoteRef key with the UUID of the Bitwarden secret holding the key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qdrant-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: qdrant-api-key
  data:
  - secretKey: api-key
    remoteRef:
      key: "00000000-0000-0000-0000-000000000000"
