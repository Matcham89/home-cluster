---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
spec:
  interval: 1m0s
  url: oci://cr.agentgateway.dev/charts/agentgateway
  ref:
    tag: v1.5.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-controller
spec:
  interval: 1m0s
  releaseName: agentgateway-controller
  chartRef:
    kind: OCIRepository
    name: agentgateway
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
    crds: Skip
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
  # Note: Kubernetes 1.34+ has stricter label validation that rejects '+' in labels
  # Fixed by enabling DisableChartDigestTracking feature gate in helm-controller
  # See: https://github.com/fluxcd/flux2/issues/4910
  values:
    controller:
      image:
        pullPolicy: Always
    # Required for AgentDesktop's fleet gateway (per-model routing via
    # AgentgatewayModel + JWT auth). Defaults to false upstream. Verified live
    # against v1.5.0: without this, AgentgatewayModel objects show Accepted
    # but the dataplane returns "route not found" for all matching traffic.
    agentgatewayModels:
      enabled: true
