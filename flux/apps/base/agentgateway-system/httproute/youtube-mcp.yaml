---
# HTTPRoute for YouTube MCP Server
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: youtube-mcp-route
spec:
  parentRefs:
    - name: agentgateway
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /youtube-mcp/
      backendRefs:
        - name: youtube-mcp-backend
          group: gateway.agentgateway.dev
          kind: Backend
