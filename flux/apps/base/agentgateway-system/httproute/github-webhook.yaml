---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-webhook
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: ingress-gateway
      namespace: ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook/github
      backendRefs:
        - name: github-webhook-backend
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
