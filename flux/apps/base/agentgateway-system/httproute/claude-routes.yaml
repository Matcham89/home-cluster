---
# ============================================================================
# CLAUDE HTTP ROUTES — all on the single shared `agentgateway` Gateway
# ============================================================================
# One path prefix per model, each rewritten to `/` and forwarded to that
# model's AgentgatewayBackend (../backends/claude-backends.yaml), which
# hardcodes the actual model — clients cannot override it. This replaces
# the previous one-Gateway-per-model setup (each model no longer needs its
# own pod/IP; the model pinning comes from the route->backend binding, not
# from a separate gateway process).
# ============================================================================

# ============================================================================
# ROUTE 1: Claude Sonnet 4.5 — /anthropic/sonnet
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claude-sonnet-route
  namespace: agentgateway-system
  labels:
    app: claude-sonnet
    model: sonnet-4-5
    provider: anthropic
spec:
  parentRefs:
    - name: agentgateway
      namespace: agentgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anthropic/sonnet
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: claude-sonnet-backend
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend

