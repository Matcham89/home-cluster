---
# ============================================================================
# OPENROUTER HTTP ROUTE — single shared passthrough path for all kagent
# OpenRouter ModelConfigs (see ../../kagent/providers/openrouter.yaml).
# Unlike the old per-model routes, there's only one path here: the caller's
# own "model" field in the request body picks the model (see
# ../backends/openrouter-backends.yaml for why).
# ============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openrouter-route
  namespace: agentgateway-system
  labels:
    app: openrouter
    provider: openrouter
spec:
  parentRefs:
    - name: ingress-gateway
      namespace: ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /openrouter
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: openrouter-backend
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
