---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway
      namespace: agentgateway-system
      sectionName: http  # Bind to HTTP listener
    - name: agentgateway
      namespace: agentgateway-system
      sectionName: https  # Bind to HTTPS listener
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/a2a/
      backendRefs:
        - name: kagent-backend
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend

