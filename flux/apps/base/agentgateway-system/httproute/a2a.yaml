---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: ingress-gateway
      namespace: ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/a2a/
      backendRefs:
        - name: kagent-backend
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend

