---
# ============================================================================
# GEMINI HTTP ROUTES — all on the single shared `agentgateway` Gateway
# ============================================================================
# Same pattern as ../httproute/claude-routes.yaml — one path prefix per
# model, rewritten to `/` and forwarded to that model's fixed backend.
# ============================================================================

# ============================================================================
# ROUTE 1: Gemini 2.5 Flash — /gemini/flash
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gemini-flash-route
  namespace: agentgateway-system
  labels:
    app: gemini-flash
    model: gemini-2-5-flash
    provider: gemini
spec:
  parentRefs:
    - name: ingress-gateway
      namespace: ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /gemini/flash
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: gemini-flash-backend
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend

---
# ============================================================================
# ROUTE 2: Gemini 2.5 Pro — /gemini/pro
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gemini-pro-route
  namespace: agentgateway-system
  labels:
    app: gemini-pro
    model: gemini-2-5-pro
    provider: gemini
spec:
  parentRefs:
    - name: ingress-gateway
      namespace: ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /gemini/pro
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: gemini-pro-backend
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
