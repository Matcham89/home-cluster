---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# Vendored upstream Kubernetes Gateway API CRDs (standard channel). agentgateway's
# own CRD charts (agentgateway-crds, agentgateway-crds) only install its custom
# resources (gateway.agentgateway.dev/*, agentgateway.dev/*) — they do NOT include
# the core Gateway API kinds (GatewayClass, Gateway, HTTPRoute, ReferenceGrant,
# etc.) that Gateway/HTTPRoute/ReferenceGrant manifests elsewhere in this repo
# and the agentgateway/agentgateway controllers themselves depend on.
#
# Source: https://github.com/kubernetes-sigs/gateway-api releases, standard
# channel, matching agentgateway.dev's official Flux install guide
# (https://agentgateway.dev/docs/kubernetes/latest/install/flux/).
#
# To bump the version, re-fetch and replace standard-install.yaml:
#   curl -fsSL \
#     https://github.com/kubernetes-sigs/gateway-api/releases/download/vX.Y.Z/standard-install.yaml \
#     -o standard-install.yaml
#
# Current version: v1.6.0
#
# NOTE: v1.6.0 still serves v1alpha2 API versions for TCPRoute/TLSRoute. As of
# v1.6.1, these are no longer included in the standard channel. If you need to
# upgrade beyond v1.6.0, you may need to switch to the experimental channel or
# coordinate with the agentgateway chart version.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./standard-install.yaml
  - ./helmrelease-agentgateway-crds.yaml
