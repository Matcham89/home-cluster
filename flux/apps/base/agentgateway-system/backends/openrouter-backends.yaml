---
# ============================================================================
# OPENROUTER AGENTGATEWAY BACKEND — passthrough
# ============================================================================
# OpenRouter (https://openrouter.ai) is an OpenAI-compatible model
# aggregator with ~400 models. This installed agentgateway version (v1.4.1)
# has no dedicated "openrouter" provider type (that's a newer release —
# https://agentgateway.dev/docs/kubernetes/latest/llm/providers/ documents
# it, but the live CRD here only has openai/custom/anthropic/gemini/etc.),
# so this uses the generic `openai` type with a host override — verified
# directly against the installed CRD schema, not just the docs.
#
# Deliberately does NOT set `model` — unlike ../claude-backends.yaml /
# ../gemini-backends.yaml (which hardcode one model per backend so the
# caller can't override it), OpenRouter's whole purpose is picking from
# many models, so this passes the caller's own "model" field straight
# through. Auth is still gateway-side only via ../secrets/openrouter-secret.yaml.
# ============================================================================

apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openrouter-backend
  namespace: agentgateway-system
  labels:
    app: openrouter
    provider: openrouter
spec:
  ai:
    groups:
      - providers:
          - name: openrouter
            host: openrouter.ai
            port: 443
            path: /api/v1/chat/completions
            openai: {}
            policies:
              auth:
                secretRef:
                  name: openrouter-secret
              tls: {}
