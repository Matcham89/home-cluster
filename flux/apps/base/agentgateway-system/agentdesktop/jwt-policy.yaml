---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentdesktop-jwt
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentdesktop
  frontend:
    accessLog:
      attributes:
        add:
          - name: llm.client
            expression: jwt.client_id
          - name: user
            expression: jwt.email
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: agentdesktop-controller
          audiences:
            - agentgateway
          jwks:
            remote:
              # Use url (not backendRef) so we can specify https:// scheme,
              # which auto-enables backend TLS. backendRef doesn't support
              # automatic TLS even with backend.tls policy block applied.
              url: "https://agentdesktop.agentdesktop.svc.cluster.local:443/.well-known/jwks.json"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentdesktop-controller-tls
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentdesktop
  backend:
    tls:
      caCertificateRefs:
        - kind: Secret
          name: agentdesktop-device-ca
