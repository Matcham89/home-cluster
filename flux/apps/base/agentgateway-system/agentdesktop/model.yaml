---
# NOTE: AgentgatewayModel's docs say a Gateway parent attaches the model
# directly to its listeners, but that did NOT work in an isolated test
# against this cluster's agentgateway v1.5.0 (dataplane returned "route not
# found" for all matching traffic even though the Model showed Accepted).
#
# UPDATE: even via the HTTPRoute-parent path, the AgentgatewayModel wildcard
# ("*") catalog routing consistently failed outbound TLS to api.anthropic.com
# ("received fatal alert: HandshakeFailure") in this cluster's agentgateway
# v1.5.0, while the AgentgatewayBackend pattern below (identical to the
# working claude-code gateway in ../backends/claude-code.yaml) round-trips
# to Anthropic successfully. AgentgatewayModel appears broken/unreliable in
# this agentgateway version — use AgentgatewayBackend instead.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: agentdesktop-backend
  namespace: agentgateway-system
  labels:
    app: agentdesktop
    provider: anthropic
spec:
  ai:
    groups:
      - providers:
          - name: anthropic
            anthropic: {}
            policies:
              auth:
                secretRef:
                  # Reuses the existing Anthropic key — see ../secrets/anthropic-secret.yaml
                  name: anthropic-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentdesktop
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentdesktop
      sectionName: http
  rules:
    - backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: agentdesktop-backend
