---
# NOTE: AgentgatewayModel's docs say a Gateway parent attaches the model
# directly to its listeners, but that did NOT work in an isolated test
# against this cluster's agentgateway v1.5.0 (dataplane returned "route not
# found" for all matching traffic even though the Model showed Accepted).
# The HTTPRoute-parent path (below) was verified working end-to-end,
# including a real Anthropic round-trip, so use that instead.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: agentdesktop
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentdesktop
  match:
    model: "*"
  provider: Anthropic
  policies:
    auth:
      secretRef:
        # Reuses the existing Anthropic key — see ../secrets/anthropic-secret.yaml
        name: anthropic-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentdesktop
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentdesktop
      sectionName: http
  rules:
    - backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayModel
          name: "*"
