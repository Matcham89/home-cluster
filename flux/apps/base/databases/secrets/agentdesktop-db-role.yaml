---
# User must create this Bitwarden item (username/password fields) and
# replace the UUID below — same shape as n8n-db-role/authentik-db-role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentdesktop-db-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: agentdesktop-db-role
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - extract:
        key: "0f29bc82-ceea-49a7-aef4-b4ba01416a5a"
