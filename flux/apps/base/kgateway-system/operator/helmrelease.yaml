---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
spec:
  interval: 1m0s
  # Switched from ghcr.io/kgateway-dev/charts (v2.2.0-main dev tag) to the
  # official stable agentgateway.dev release, per
  # https://agentgateway.dev/docs/kubernetes/latest/install/flux/ — the dev
  # tag's controller hard-requires the deprecated v1alpha2 TCPRoute/TLSRoute
  # API versions, which the standard Gateway API CRD channel no longer serves
  # (see ../gateway-api-crds/kustomization.yaml).
  #
  # BREAKING: this chart has a different values schema than the kgateway-dev
  # fork. `gateway.aiExtension.enabled` / `agentgateway.enabled` (used to
  # configure the per-model Claude gateways — see CLAUDE-ARCHITECTURE.md in
  # this directory) do NOT exist here and were dropped below. The closest
  # equivalent in this chart looks to be `agentgatewayModels` (the
  # "experimental AgentgatewayModel API" — currently disabled by default);
  # the Claude multi-gateway routing needs to be rebuilt against that (or
  # another v1.4.1-native mechanism) as follow-up work.
  url: oci://cr.agentgateway.dev/charts/agentgateway
  ref:
    tag: v1.4.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-controller
spec:
  interval: 1m0s
  releaseName: agentgateway-controller
  chartRef:
    kind: OCIRepository
    name: agentgateway
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
    crds: Skip
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
  # Note: Kubernetes 1.34+ has stricter label validation that rejects '+' in labels
  # Fixed by enabling DisableChartDigestTracking feature gate in helm-controller
  # See: https://github.com/fluxcd/flux2/issues/4910
  values:
    controller:
      image:
        pullPolicy: Always
