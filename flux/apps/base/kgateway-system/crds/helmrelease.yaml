---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kgateway-crds
spec:
  interval: 1m0s
  url: oci://cr.kgateway.dev/kgateway-dev/charts/kgateway-crds
  ref:
    tag: v2.2.0-main
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway-crds
spec:
  interval: 1m0s
  chartRef:
    kind: OCIRepository
    name: kgateway-crds
  install:
    crds: CreateReplace
  values:
    controller:
    image:
      pullPolicy: Always

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway-crds
spec:
  interval: 1m0s
  # Switched from ghcr.io/kgateway-dev/charts (v2.2.0-main dev tag) to the
  # official stable agentgateway.dev release, per
  # https://agentgateway.dev/docs/kubernetes/latest/install/flux/ — the dev
  # tag's controller hard-requires the deprecated v1alpha2 TCPRoute/TLSRoute
  # API versions, which the standard Gateway API CRD channel no longer serves.
  url: oci://cr.agentgateway.dev/charts/agentgateway-crds
  ref:
    tag: v1.4.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
spec:
  interval: 1m0s
  chartRef:
    kind: OCIRepository
    name: agentgateway-crds
  install:
    crds: CreateReplace
  values:
    controller:
    image:
      pullPolicy: Always
