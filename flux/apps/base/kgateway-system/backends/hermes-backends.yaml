---
# ============================================================================
# HERMES AGENTGATEWAY BACKENDS
# ============================================================================
# Dedicated route/backend for Hermes (standalone box on the LAN, not a
# kagent agent) — same upstream/secret as ./openrouter-backends.yaml, just a
# separate route (../httproute/hermes-routes.yaml) so its traffic shows up
# distinctly in Grafana's "Calls by Route" panel
# (../../monitoring/kube-prometheus-stack/dashboards/agentgateway-ai-traffic.yaml).
# Needed because externalTrafficPolicy: Cluster on the agentgateway Service
# SNATs Hermes' real source IP, so route is the only reliable way to tell
# its traffic apart from kagent's on the shared route.
#
# Passthrough (no hardcoded `model`) — Hermes' own request body picks the
# model, so this backend/route is model-agnostic. Not named after any one
# model (previously "hermes-deepseek-v4-flash", which stopped making sense
# once Hermes started using other models too).
#
# `policies.ai.routes` is set because Hermes auto-probes several
# llama.cpp/Ollama-style capability-detection endpoints on startup
# (/props, /version, /api/tags, /api/show, /v1/models, plain GETs with no
# body) that all 503 under the default (every path treated as Completions,
# which requires a JSON body to parse). Everything except the real
# completions endpoint falls through to `Passthrough` so it's forwarded
# as-is to openrouter.ai instead of erroring in agentgateway's own request
# parser — confirmed this agentgateway version (v1.4.1) doesn't implement
# the `Models` format type (a clean 501, not a crash) so Passthrough is
# used there too; OpenRouter's real GET /api/v1/models can answer directly.
# ============================================================================

apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: hermes-backend
  namespace: kgateway-system
  labels:
    app: hermes
    provider: openrouter
spec:
  ai:
    groups:
      - providers:
          - name: hermes
            host: openrouter.ai
            port: 443
            path: /api/v1/chat/completions
            openai: {}
            policies:
              auth:
                secretRef:
                  name: openrouter-secret
              tls: {}
              ai:
                routes:
                  "/chat/completions": Completions
                  "/v1/chat/completions": Completions
                  "*": Passthrough
