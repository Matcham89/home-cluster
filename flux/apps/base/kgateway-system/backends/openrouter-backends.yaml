---
# ============================================================================
# OPENROUTER AGENTGATEWAY BACKENDS
# ============================================================================
# OpenRouter (https://openrouter.ai) is an OpenAI-compatible model
# aggregator, not a "managed" provider AgentgatewayBackend has a built-in
# type for (unlike Anthropic/Gemini) — so these use `custom` with an
# explicit host/port/format, pointed at OpenRouter's chat-completions
# endpoint. Same enforcement pattern as ../claude-backends.yaml /
# ../gemini-backends.yaml: model is HARDCODED per-backend, so the caller
# (kagent) can't override it — it only selects one of these five by which
# route/backend it hits. Auth is entirely gateway-side via
# ../secrets/openrouter-secret.yaml; kagent never sees the real key.
# ============================================================================

apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openrouter-deepseek-v4-flash-backend
  namespace: kgateway-system
  labels:
    app: openrouter
    provider: openrouter
spec:
  ai:
    groups:
      - providers:
          - name: openrouter-deepseek-v4-flash
            host: openrouter.ai
            port: 443
            custom:
              model: "deepseek/deepseek-v4-flash-latest"
              formats:
                - type: Completions
                  path: /api/v1/chat/completions
            policies:
              auth:
                secretRef:
                  name: openrouter-secret
              tls: {}

