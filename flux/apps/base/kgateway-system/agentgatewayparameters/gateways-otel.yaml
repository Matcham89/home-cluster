---
# One AgentgatewayParameters per Gateway (mirroring ./otel.yaml, which only
# ever covered the "agentgateway" Gateway) so every agentgateway-class
# Gateway actually exports traces — see ../gateway/*.yaml infrastructure.
# Each gets its own OTEL_SERVICE_NAME so spanmetrics/Tempo can tell gateways
# apart instead of bucketing all traffic under one "agentgateway" service.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agentgateway1-otel
  namespace: kgateway-system
spec:
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://otel-collector-collector.monitoring.svc.cluster.local:4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    - name: OTEL_SERVICE_NAME
      value: "agentgateway1"
    - name: OTEL_TRACES_EXPORTER
      value: "otlp"
    - name: OTEL_LOGS_EXPORTER
      value: "otlp"
  rawConfig:
    config:
      tracing:
        otlpEndpoint: "http://otel-collector-collector.monitoring.svc.cluster.local:4317"
        otlpProtocol: grpc
---
