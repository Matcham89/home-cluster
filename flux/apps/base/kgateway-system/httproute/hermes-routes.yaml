---
# ============================================================================
# HERMES HTTP ROUTES — dedicated path so Hermes' traffic is distinguishable
# from kagent's on the shared agentgateway Gateway (see ../backends/hermes-backends.yaml)
# ============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-route
  namespace: kgateway-system
  labels:
    app: hermes
    provider: openrouter
spec:
  parentRefs:
    - name: agentgateway
      namespace: kgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hermes
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: hermes-backend
          namespace: kgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
