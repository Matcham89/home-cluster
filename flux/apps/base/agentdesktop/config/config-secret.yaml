---
# Assembles the full controller.yaml (see deploy/helm/agentdesktop-controller/
# templates/configmap.yaml upstream) as a Secret, since it embeds the CNPG
# role's plaintext password — this is mounted via the chart's
# existingConfigSecret/configSecretKey escape hatch instead of passing
# databaseUrl through plaintext Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentdesktop-controller-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: agentdesktop-controller-config
    template:
      data:
        controller.yaml: |
          fleetListen: 0.0.0.0:8443
          adminListen: 127.0.0.1:8080
          databaseUrl: "postgresql://agentdesktop:{{ .password }}@postgres-cluster-rw.databases.svc.cluster.local:5432/agentdesktop?sslmode=require"
          tls: /etc/agentdesktop/tls
          allowInsecureDev: false
          oidc:
            issuer: "https://authentik.kubegit.com/application/o/agentdesktop/"
            # Public/native client (PKCE, no secret) — must match
            # authentik_provider_oauth2.agentdesktop.client_id in
            # terraform/authentik/applications.tf exactly.
            clientId: "agentdesktop"
            redirectUri: "http://127.0.0.1:51327/callback"
          gatewayJwt:
            privateKey: /etc/agentdesktop/tls/gateway-jwt-key.pem
            issuer: agentdesktop-controller
            keyId: agentdesktop
            lifetime: 15m
          daemonConfig:
            path: /etc/agentdesktop/config/daemon.yaml
        daemon.yaml: |
          llmGateway:
            # Distributed to external workstation daemons, so this must be an
            # address reachable from OUTSIDE the cluster (the gateway's own
            # LoadBalancer IP), not the in-cluster Service DNS name that
            # databaseUrl above correctly uses for the controller's own
            # in-cluster Postgres connection.
            url: "http://192.168.1.204:8095/"
            authentication:
              type: controllerJwt
              audience: "agentgateway"
              allowedClientIds: [claude-code, claude-desktop, codex, opencode]
          telemetry:
            events:
            - session.new
            - tool.use           # Base tool use event: agent, tool name, invocation ID
            - tool.use.input     # Detailed input: source code, prompts, tool parameters
            - tool.use.output    # Tool execution result/response
            - tool.use.error     # Tool execution errors/failures

            # Tool use event fields to capture:
            # - agent: which tool (Claude Code, Claude Desktop, Codex, etc)
            # - tool_name: specific tool invoked (e.g. git, bash, file_editor)
            # - invocation_id: unique request ID for tracking
            # - timestamp: when tool was invoked
            # - duration: execution time
            # - success: whether tool execution succeeded
          programs:
            claudeCode:
              companyAnnouncements:
              - "Managed by Agentdesktop"
  dataFrom:
    - extract:
        key: "0f29bc82-ceea-49a7-aef4-b4ba01416a5a"
