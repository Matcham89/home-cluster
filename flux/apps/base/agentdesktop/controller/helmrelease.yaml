---
# Chart only exists in-repo (no OCI/Helm-repo publish yet), so source it
# directly from git. renovate/dependabot won't track this — bump the tag by
# hand, same as substrate/agentgateway tags elsewhere in this repo.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: agentdesktop
spec:
  interval: 1h
  url: https://github.com/agentdesktop-dev/agentdesktop
  ref:
    tag: v0.1.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentdesktop
spec:
  interval: 1h
  releaseName: agentdesktop
  chart:
    spec:
      chart: ./deploy/helm/agentdesktop-controller
      sourceRef:
        kind: GitRepository
        name: agentdesktop
  install:
    createNamespace: true
    remediation:
      retries: 3
    timeout: 5m
  upgrade:
    timeout: 5m
  # Upstream (ghcr.io/agentdesktop-dev/agentdesktop-controller) never publicly
  # published a controller image — its v0.1.0 release workflow run succeeded
  # but GHCR packages default to private, and no one flipped visibility.
  # Built our own from source instead: forked to github.com/Matcham89/agentdesktop,
  # fixed an upstream bug (release.yml hardcodes ${{ github.repository_owner }}
  # into the image tag, which is invalid for any account with uppercase
  # letters — Docker/OCI names must be lowercase; the upstream org name just
  # happens to already be all-lowercase so they never hit it), and triggered
  # their own release workflow on real GitHub-hosted amd64 runners (native,
  # no local QEMU cross-arch emulation needed). Confirmed public via anonymous
  # pull. Bump this tag by hand alongside the GitRepository tag above.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: agentdesktop
            patch: |-
              - op: add
                path: /metadata/annotations
                value:
                  metallb.universe.tf/loadBalancerIPs: "192.168.1.205"
              - op: add
                path: /spec/ports/-
                value:
                  name: admin
                  port: 8080
                  protocol: TCP
                  targetPort: admin-proxy
          # The chart's existingConfigSecret path only projects the single
          # configSecretKey (controller.yaml) into the config volume — it
          # doesn't know about daemon.yaml, which the same Secret also holds
          # (see ../config/config-secret.yaml). Add it so
          # controller.yaml's daemonConfig.path can actually resolve.
          #
          # Also adds a socat sidecar: the controller's admin UI must bind to
          # a loopback address (enforced by the app itself, see
          # ../../ingress/httproutes/agentdesktop.yaml), so it's unreachable
          # from the Service/HTTPRoute. The sidecar shares the pod's network
          # namespace and relays 0.0.0.0:8081 -> 127.0.0.1:8080.
          - target:
              kind: Deployment
              name: agentdesktop
            patch: |-
              - op: add
                path: /spec/template/spec/volumes/0/secret/items/-
                value:
                  key: daemon.yaml
                  path: daemon.yaml
              - op: add
                path: /spec/template/spec/containers/-
                value:
                  name: admin-proxy
                  image: alpine/socat:1.8.0.1
                  args:
                    - tcp-listen:8081,fork,reuseaddr
                    - tcp-connect:127.0.0.1:8080
                  ports:
                    - name: admin-proxy
                      containerPort: 8081
                      protocol: TCP
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                    readOnlyRootFilesystem: true
                  resources:
                    requests:
                      cpu: 5m
                      memory: 16Mi
                    limits:
                      memory: 32Mi
  values:
    existingConfigSecret: agentdesktop-controller-config
    configSecretKey: controller.yaml
    tlsSecretName: agentdesktop-controller-tls
    image:
      repository: ghcr.io/matcham89/agentdesktop-controller
      tag: v0.1.0
    service:
      type: LoadBalancer
      port: 443
