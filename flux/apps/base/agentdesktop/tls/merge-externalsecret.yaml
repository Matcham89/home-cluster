---
# Renames the three cert-manager-issued secrets' tls.crt/tls.key/ca.crt keys
# into the exact filenames deploy/helm/agentdesktop-controller's deployment.yaml
# mounts at /etc/agentdesktop/tls (controller.pem, controller-key.pem,
# device-ca.pem, device-ca-key.pem, gateway-jwt-key.pem).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentdesktop-controller-tls
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: agentdesktop-in-cluster
    kind: SecretStore
  target:
    name: agentdesktop-controller-tls
    template:
      data:
        controller.pem: "{{ .controllerCert }}"
        controller-key.pem: "{{ .controllerKey }}"
        device-ca.pem: "{{ .deviceCaCert }}"
        device-ca-key.pem: "{{ .deviceCaKey }}"
        gateway-jwt-key.pem: "{{ .jwtKey }}"
  data:
    - secretKey: controllerCert
      remoteRef:
        key: agentdesktop-controller-cert
        property: tls.crt
    - secretKey: controllerKey
      remoteRef:
        key: agentdesktop-controller-cert
        property: tls.key
    - secretKey: deviceCaCert
      remoteRef:
        key: agentdesktop-device-ca-root
        property: tls.crt
    - secretKey: deviceCaKey
      remoteRef:
        key: agentdesktop-device-ca-root
        property: tls.key
    - secretKey: jwtKey
      remoteRef:
        key: agentdesktop-gateway-jwt-key
        property: tls.key
