---
# ESO's "kubernetes" provider lets an ExternalSecret re-shape OTHER in-cluster
# Secrets (cert-manager always writes tls.crt/tls.key/ca.crt — we need custom
# filenames the agentdesktop-controller chart's volume mount expects).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentdesktop-secret-reader
  namespace: agentdesktop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentdesktop-secret-reader
  namespace: agentdesktop
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentdesktop-secret-reader
  namespace: agentdesktop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentdesktop-secret-reader
subjects:
  - kind: ServiceAccount
    name: agentdesktop-secret-reader
    namespace: agentdesktop
---
# Cluster-scoped (not namespaced SecretStore) so the agentgateway-system CA
# mirror ExternalSecret (../../agentgateway-system/agentdesktop/ca-trust.yaml)
# can also use it — ESO's kubernetes provider otherwise requires the
# ExternalSecret and SecretStore to share a namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: agentdesktop-in-cluster
spec:
  provider:
    kubernetes:
      remoteNamespace: agentdesktop
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: agentdesktop-secret-reader
          namespace: agentdesktop
