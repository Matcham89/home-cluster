---
# All Claude models route through the single shared agentgateway Gateway
# (../../agentgateway-system/gateway/agentgateway.yaml) — no direct Anthropic
# API access. Model is hardcoded per-backend on the gateway side
# (../../agentgateway-system/backends/claude-backends.yaml), so the model can't
# be overridden by the client; the path prefix just selects which backend.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: claude-sonnet-config
  namespace: kagent
spec:
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
  model: claude-sonnet-4-5-20250929
  provider: OpenAI
  openAI:
    baseUrl: http://agentgateway.agentgateway-system.svc.cluster.local:8080/anthropic/sonnet/v1
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: claude-opus-config
  namespace: kagent
spec:
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
  model: claude-opus-4-5
