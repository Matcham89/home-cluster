---
# OpenRouter models, routed entirely through agentgateway
# (../../kgateway-system/backends/openrouter-backends.yaml) — kagent holds
# no real API key for these (../secrets/openrouter-placeholder.yaml is a
# non-secret placeholder; the gateway injects the real credential).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: openrouter-deepseek-v4-flash
  namespace: kagent
spec:
  apiKeySecret: kagent-openrouter-placeholder
  apiKeySecretKey: OPENROUTER_API_KEY
  model: deepseek/deepseek-v4-flash-latest
  provider: OpenAI
  openAI:
    baseUrl: http://agentgateway.kgateway-system.svc.cluster.local:8080/openrouter/deepseek-v4-flash/v1
---
