---
# OpenRouter models, routed entirely through agentgateway's single shared
# passthrough backend (../../kgateway-system/backends/openrouter-backends.yaml)
# — kagent holds no real API key for these
# (../secrets/openrouter-placeholder.yaml is a non-secret placeholder; the
# gateway injects the real credential). All 5 share the same baseUrl now:
# the gateway no longer hardcodes a model per route, so the `model` field
# below is sent for real on every request and must be the exact OpenRouter
# model ID.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: openrouter-deepseek-v4-flash
  namespace: kagent
spec:
  apiKeySecret: kagent-openrouter-placeholder
  apiKeySecretKey: OPENROUTER_API_KEY
  model: "~deepseek/deepseek-v4-flash-latest"
  provider: OpenAI
  openAI:
    baseUrl: http://agentgateway.kgateway-system.svc.cluster.local:8080/openrouter/v1
---
