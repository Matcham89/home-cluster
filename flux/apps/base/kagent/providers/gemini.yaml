apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: gemini-flash
  namespace: kagent
spec:
  model: gemini-2.5-flash
  provider: OpenAI
  apiKeySecret: kagent-google
  apiKeySecretKey: GOOGLE_API_KEY
  openAI:
    baseUrl: http://agentgateway.agentgateway-system.svc.cluster.local:8080/gemini/flash/v1
---
