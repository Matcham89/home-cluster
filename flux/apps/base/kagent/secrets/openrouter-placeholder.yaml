---
# NOT a real credential. OpenRouter auth is handled entirely gateway-side
# (../../kgateway-system/secrets/openrouter-secret.yaml, injected by
# ../../kgateway-system/backends/openrouter-backends.yaml) — kagent never
# holds the real OpenRouter API key. This plain, non-secret placeholder
# only exists because kagent's OpenAI-compatible client requires some
# non-empty Authorization value to construct requests at all.
apiVersion: v1
kind: Secret
metadata:
  name: kagent-openrouter-placeholder
type: Opaque
stringData:
  OPENROUTER_API_KEY: "not-a-real-key-agentgateway-injects-auth"
