---
# Qdrant API key for qdrant-mcp-server (same Bitwarden secret as the qdrant
# namespace's qdrant-api-key). Exposed as QDRANT_API_KEY in the MCP deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qdrant-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: qdrant-api-key
  data:
    - secretKey: api-key
      remoteRef:
        # TODO: replace with the Bitwarden secret ID of the Qdrant API key
        key: "00000000-0000-0000-0000-000000000000"
